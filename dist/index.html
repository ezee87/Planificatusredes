<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f8faf7">
  <meta name="description" content="Organizá tus publicaciones, guardá ideas y seguí el progreso de tu contenido en un solo lugar.">
  <link rel="icon" href="favicon.svg?v=799a988ea57e" type="image/svg+xml">
  <title>Planifica tus redes · Tu contenido, en orden</title>
  <link rel="stylesheet" href="commercial.css">
  <link rel="stylesheet" href="custom-selects.css">
  <link rel="stylesheet" href="bonos.css">
  <style>
    :root { color-scheme: light; --bg:#f7f8f5; --paper:#fff; --paper-soft:#fbfcfa; --text:#203029; --ink:#172820; --muted:#66756d; --primary:#50735c; --primary-dark:#3b6048; --primary-wash:#eaf2e9; --line:#e5ebe5; --line-strong:#d9e2d9; --shadow:0 15px 50px rgba(28,51,34,.045); --radius:20px; --sidebar:250px; }
    *,*::before,*::after { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; }
    button,input,textarea,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible { outline:3px solid #9fc5a6; outline-offset:3px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    a { color:inherit; }
    svg { width:20px; height:20px; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; fill:none; flex-shrink:0; }
    h1,h2,h3,p { margin-top:0; }
    .app { display:grid; grid-template-columns:var(--sidebar) minmax(0,1fr); min-height:100vh; }
    .sidebar { position:sticky; top:0; height:100vh; padding:28px 18px 22px; display:flex; flex-direction:column; background:#fff; border-right:1px solid var(--line); z-index:6; }
    .brand { display:flex; gap:13px; align-items:center; padding:6px 10px 32px; text-decoration:none; }
    .brand-mark { display:grid; place-items:center; width:43px; height:43px; border-radius:14px; background:var(--primary); color:#fff; box-shadow:0 8px 18px rgba(74,110,81,.16); }
    .brand-mark svg { width:24px; height:24px; }
    .brand-name { font-size:18px; line-height:1.1; color:var(--ink); font-weight:760; letter-spacing:-.7px; }
    .brand-tag { color:var(--muted); margin-top:5px; font-size:16px; }
    .nav-caption { margin:12px 14px 10px; font-size:16px; font-weight:750; text-transform:uppercase; letter-spacing:.12em; color:#97a29b; }
    .nav { display:grid; gap:6px; }
    .nav-btn { display:flex; gap:13px; align-items:center; text-align:left; border:0; border-radius:12px; color:#5b6c61; background:transparent; padding:13px 14px; min-height:52px; font-weight:600; width:100%; }
    .nav-btn.active { color:var(--primary-dark); background:var(--primary-wash); }
    .nav-btn:hover:not(.active) { background:#f6f8f5; }
    .nav-btn svg { width:21px; height:21px; }
    .nav-count { margin-left:auto; border-radius:999px; background:#e1ece2; min-width:27px; height:27px; text-align:center; line-height:27px; font-size:16px; color:#4b6b50; }
    .sidebar-bottom { margin-top:auto; }
    .local-note { background:#f5f8f3; border:1px solid #e5eee3; border-radius:16px; padding:15px; margin-bottom:15px; }
    .local-note-head { display:flex; gap:9px; font-size:16px; font-weight:700; align-items:center; color:#52765a; margin-bottom:8px; }
    .local-note-head svg { width:19px; height:19px; }
    .local-note p { margin:0; color:#6f8275; font-size:16px; line-height:1.5; }
    .backup-btn { display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:46px; width:100%; border:0; background:transparent; color:#53675a; font-weight:600; text-align:left; border-radius:10px; font-size:16px; }
    .backup-btn:hover { background:#f4f7f2; }
    .backup-btn svg { width:18px; height:18px; }
    .main { min-width:0; padding:38px clamp(18px,3vw,52px) 20px; }
    .main-inner { max-width:1570px; margin:0 auto; }
    .mobile-brand { display:none; position:relative; }
    .mobile-backup-menu { display:none; position:absolute; top:52px; right:0; width:min(300px,calc(100vw - 32px)); padding:13px; background:#fff; border:1px solid var(--line); border-radius:15px; box-shadow:0 15px 45px rgba(22,44,29,.15); z-index:32; }
    .mobile-backup-menu.open { display:block; }
    .mobile-backup-menu h3 { margin:3px 6px 8px; color:#3f6549; font-size:16px; }
    .mobile-backup-menu button { width:100%; display:flex; gap:10px; align-items:center; padding:12px; border:0; border-radius:10px; background:#fff; color:#4f7456; font-size:16px; font-weight:650; text-align:left; min-height:48px; }
    .mobile-backup-menu button:hover { background:#edf5eb; }
    .page-header { display:flex; gap:20px; align-items:center; justify-content:space-between; margin-bottom:26px; }
    .eyebrow { display:flex; align-items:center; gap:8px; color:var(--primary); font-size:16px; text-transform:uppercase; letter-spacing:.14em; font-weight:800; margin-bottom:10px; }
    .eyebrow:before { content:""; height:7px; width:7px; background:#79a887; border-radius:50%; }
    .page-header h1 { font-size:clamp(30px,3vw,41px); line-height:1.15; font-weight:760; letter-spacing:-1.45px; margin:0 0 8px; color:var(--ink); }
    .lead { margin:0; color:var(--muted); font-size:16px; }
    .btn { border:1px solid transparent; display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:12px 18px; min-height:48px; border-radius:12px; font-weight:700; transition:background .15s ease, transform .15s ease,border-color .15s ease; white-space:nowrap; }
    .btn:hover:not(:disabled) { transform:translateY(-1px); }
    .btn svg { width:19px; height:19px; }
    .btn-primary { background:var(--primary); color:#fff; box-shadow:0 5px 13px rgba(73,114,81,.12); }
    .btn-primary:hover { background:var(--primary-dark); }
    .btn-outline { background:#fff; border-color:var(--line-strong); color:#48604d; }
    .btn-outline:hover { background:#f5f8f4; }
    .btn-muted { background:#eff4ef; color:#48694e; }
    .btn-muted:hover { background:#e5eee4; }
    .btn-plain { background:transparent; color:#5c7261; padding-inline:12px; }
    .btn-danger { background:#fff5f2; color:#b44d48; border-color:#f2ddd8; }
    .metric-row { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:22px; }
    .metric { min-width:0; padding:22px 22px 19px; background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); }
    .metric-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:22px; }
    .metric-label { color:#69796f; font-size:16px; font-weight:620; }
    .metric-icon { border-radius:11px; width:38px; height:38px; display:grid; place-items:center; background:#e9f0e7; color:#5f8164; }
    .metric-icon svg { width:19px; height:19px; }
    .metric:nth-child(2) .metric-icon { background:#fff2db; color:#b38748; }
    .metric:nth-child(3) .metric-icon { background:#e4eff2; color:#638997; }
    .metric:nth-child(4) .metric-icon { background:#e6eee8; color:#537860; }
    .metric-value { font-size:35px; letter-spacing:-1.2px; line-height:1; font-weight:760; color:var(--ink); margin:0 0 9px; }
    .metric-foot { color:#96a29a; font-size:16px; margin:0; }
    .board-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(272px,304px); gap:20px; align-items:start; }
    .surface { background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0; overflow:hidden; }
    .surface-header { padding:22px 24px 20px; display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .surface-title { font-size:21px; font-weight:760; letter-spacing:-.55px; margin:0; color:var(--ink); }
    .surface-subtitle { font-size:16px; margin:6px 0 0; color:var(--muted); }
    .toolbar { padding:0 24px 20px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .range-controls,.view-controls { display:flex; gap:7px; align-items:center; }
    .range-label { font-size:19px; font-weight:750; color:#26392d; letter-spacing:-.4px; margin:0 8px 0 2px; }
    .icon-btn { flex-shrink:0; display:grid; place-items:center; height:41px; width:41px; border-radius:11px; border:1px solid var(--line); background:#fff; color:#536b59; }
    .icon-btn:hover { background:var(--primary-wash); }
    .icon-btn svg { width:18px; height:18px; }
    .today-btn { min-height:41px; padding:7px 12px; background:#fff; border:1px solid var(--line); border-radius:10px; color:#526653; font-weight:650; font-size:16px; }
    .today-btn:hover { background:#f0f5f0; }
    .segmented { display:flex; gap:3px; padding:4px; border:1px solid #e8eee8; border-radius:12px; background:#f3f6f2; }
    .segmented button { border:0; background:transparent; border-radius:9px; min-height:35px; padding:5px 12px; color:#809086; font-size:16px; font-weight:650; }
    .segmented button.active { background:#fff; color:#40664a; box-shadow:0 1px 6px rgba(33,54,36,.1); }
    .weekday-row { border-top:1px solid var(--line); border-bottom:1px solid var(--line); display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); background:#fbfcfb; }
    .weekday-row span { padding:11px 9px; text-align:center; color:#94a197; font-size:16px; font-weight:750; letter-spacing:.07em; }
    .month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
    .calendar-day { min-width:0; min-height:122px; position:relative; padding:10px 8px 8px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); background:#fff; transition:background .12s ease; }
    .calendar-day:nth-child(7n) { border-right:0; }
    .calendar-day.is-outside { background:#fbfcfa; }
    .calendar-day.is-selected { background:#f4f8f2; box-shadow:inset 0 0 0 2px #bad1bc; }
    .calendar-day.drop-active,.week-day.drop-active { background:#e4f1e5!important; outline:2px dashed #578b67; outline-offset:-4px; }
    .calendar-day:hover:not(.drop-active) { background:#f7faf6; }
    .cal-day-top { display:flex; align-items:center; justify-content:space-between; min-width:0; margin-bottom:6px; }
    .day-number { border:0; background:transparent; min-width:32px; height:32px; display:inline-grid; place-items:center; border-radius:50%; padding:0; font-weight:700; color:#526458; font-size:16px; }
    .is-outside .day-number { color:#b3bdb4; }
    .is-today .day-number { background:var(--primary); color:#fff; }
    .day-add { border:0; width:29px; height:29px; background:transparent; color:#a3b2a6; display:grid; place-items:center; border-radius:8px; opacity:0; }
    .day-add svg { width:16px; height:16px; }
    .calendar-day:hover .day-add,.calendar-day:focus-within .day-add { opacity:1; }
    .day-add:hover { color:#3f6c4a; background:#e3eee3; }
    .cal-event { display:flex; align-items:center; gap:2px; width:100%; min-width:0; margin-bottom:5px; border-radius:6px; background:#f2f5f2; padding:1px; }
    .cal-event-content { display:flex; align-items:center; gap:5px; color:#4a6254; font-size:16px; text-align:left; padding:4px 2px; border:0; background:transparent; min-width:0; flex:1; }
    .cal-event-content span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cal-event-dot { display:block; width:6px; height:6px; background:#8aa38e; border-radius:50%; flex-shrink:0; }
    .cal-event.preparation { background:#fdf2dd; }
    .cal-event.preparation .cal-event-dot { background:#c9974b; }
    .cal-event.preparation .cal-event-content { color:#916b35; }
    .cal-event.ready { background:#e8f2ef; }
    .cal-event.ready .cal-event-dot { background:#6b9ca0; }
    .cal-event.ready .cal-event-content { color:#4d7476; }
    .cal-event.published { background:#e7f2e9; }
    .cal-event.published .cal-event-dot { background:#518660; }
    .cal-event.published .cal-event-content { color:#3d6f49; }
    .tiny-grip { border:0; padding:2px; background:transparent; border-radius:4px; color:#9eaca1; line-height:0; touch-action:none; cursor:grab; }
    .tiny-grip svg { width:14px; height:14px; }
    .tiny-grip:hover { color:#456c4c; }
    .day-more { color:#829586; background:none; border:0; font-size:16px; font-weight:750; padding:2px 3px; }
    .day-dots { display:none; }
    .selected-day-panel { background:#fff; padding:23px 24px 26px; }
    .selected-day-heading { display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:17px; }
    .selected-day-heading h3 { margin:0; color:#283e2d; font-size:19px; font-weight:760; letter-spacing:-.5px; }
    .selected-day-heading p { margin:4px 0 0; color:#96a49a; font-size:16px; }
    .card-list { display:grid; gap:10px; }
    .post-card { display:flex; gap:12px; align-items:center; padding:14px; border:1px solid var(--line); border-radius:13px; background:#fff; min-width:0; }
    .post-card:hover { border-color:#cbdacb; }
    .platform-icon { width:39px; height:39px; border-radius:12px; display:grid; place-items:center; background:#f1f4ef; color:#6d806f; font-weight:800; font-size:16px; flex-shrink:0; letter-spacing:-.5px; }
    .platform-icon.instagram { background:#f9eaf0; color:#b75c82; }
    .platform-icon.tiktok { background:#e9edf1; color:#4b646e; }
    .platform-icon.linkedin { background:#e7f0fa; color:#477aab; }
    .platform-icon.facebook { background:#edf1fd; color:#5f81ba; }
    .platform-icon.youtube { background:#ffeae6; color:#b35e51; }
    .post-info { flex:1; min-width:0; }
    .post-title { font-size:16px; font-weight:740; line-height:1.3; color:#253d2e; margin:0 0 6px; overflow-wrap:anywhere; }
    .post-meta { display:flex; gap:7px; flex-wrap:wrap; align-items:center; color:#8b9b8f; font-size:16px; }
    .post-meta span:not(:last-child)::after { content:"·"; padding-left:7px; }
    .status-pill { display:inline-flex; align-items:center; padding:4px 9px; border-radius:999px; font-size:16px; font-weight:750; background:#f3f5f0; color:#819180; white-space:nowrap; }
    .status-pill.preparation { background:#fff3dd; color:#a87634; }
    .status-pill.ready { background:#e9f2f5; color:#587e8f; }
    .status-pill.published { background:#e9f3ea; color:#4d815a; }
    .post-actions { display:flex; gap:3px; align-items:center; flex-shrink:0; }
    .subtle-icon { border:0; background:transparent; width:39px; height:39px; border-radius:9px; display:grid; place-items:center; color:#859889; }
    .subtle-icon:hover { background:#eef4ed; color:var(--primary-dark); }
    .subtle-icon svg { width:18px; height:18px; }
    .drag-handle { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
    .drag-handle:active { cursor:grabbing; }
    .week-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--line); }
    .week-day { min-height:270px; min-width:0; padding:13px 9px; border-right:1px solid var(--line); background:#fff; }
    .week-day:last-child { border-right:0; }
    .week-day.is-selected { background:#f7faf6; }
    .week-day-head { display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:15px; }
    .week-day-head .weekday { font-size:16px; font-weight:720; text-transform:uppercase; color:#98a99a; }
    .week-day-head .date-circle { border:0; background:none; font-size:20px; font-weight:750; color:#526a57; display:grid; place-items:center; width:38px; height:38px; border-radius:50%; }
    .week-day.is-today .date-circle { background:var(--primary); color:white; }
    .week-event { border:1px solid var(--line); border-radius:10px; background:#fff; padding:9px 7px; margin-bottom:8px; min-width:0; }
    .week-event-top { display:flex; justify-content:space-between; align-items:center; gap:2px; margin-bottom:6px; }
    .week-event-label { color:#819484; font-size:16px; font-weight:750; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .week-event-title { display:block; text-align:left; background:none; border:0; padding:0; color:#2b4332; font-size:16px; font-weight:740; overflow-wrap:anywhere; width:100%; }
    .week-event .status-pill { margin-top:8px; max-width:100%; font-size:16px; }
    .week-add { border:1px dashed #d6e2d5; color:#819685; background:#f7faf6; width:100%; min-height:39px; border-radius:9px; font-size:16px; font-weight:680; display:flex; gap:5px; align-items:center; justify-content:center; }
    .week-add svg { width:14px; height:14px; }
    .week-add:hover { background:#ebf3e9; color:#416e4a; }
    .idea-rail { padding:23px 20px; position:sticky; top:24px; }
    .section-kicker { text-transform:uppercase; font-weight:800; letter-spacing:.13em; font-size:16px; color:#93a398; }
    .rail-heading { display:flex; gap:10px; align-items:center; justify-content:space-between; margin-bottom:7px; }
    .rail-heading h2 { margin:0; font-size:20px; letter-spacing:-.5px; color:var(--ink); }
    .rail-desc { color:#90a096; font-size:16px; line-height:1.5; margin:0 0 19px; }
    .rail-idea-list { display:grid; gap:10px; max-height:520px; overflow-y:auto; padding-right:2px; }
    .idea-card { border:1px solid #e4eae1; border-radius:14px; padding:14px; background:#fcfdfa; min-width:0; }
    .idea-card:hover { border-color:#cbdcca; background:#f9fcf8; }
    .idea-card-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
    .idea-label { font-size:16px; font-weight:750; letter-spacing:.03em; color:#6a936f; background:#edf4eb; padding:5px 8px; border-radius:7px; }
    .idea-card h3 { font-size:16px; line-height:1.4; margin:0 0 7px; color:#2c4431; overflow-wrap:anywhere; }
    .idea-card p { font-size:16px; color:#91a094; margin:0 0 14px; overflow-wrap:anywhere; }
    .idea-card-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .text-btn { display:inline-flex; align-items:center; gap:5px; border:0; padding:5px 0; background:transparent; color:#4e7655; font-size:16px; font-weight:760; }
    .text-btn:hover { color:#244c2d; }
    .text-btn svg { width:16px; height:16px; }
    .rail-bottom { display:grid; gap:10px; margin-top:17px; }
    .rail-bottom .btn { width:100%; }
    .rail-drag-hint { display:flex; align-items:flex-start; gap:8px; color:#9baa9d; font-size:16px; line-height:1.5; margin-top:15px; }
    .rail-drag-hint svg { width:18px; height:18px; margin-top:1px; }
    .empty-small { display:grid; gap:12px; place-items:center; text-align:center; padding:28px 14px; border:1px dashed #dce6da; background:#fafcf9; border-radius:15px; }
    .empty-illustration { display:grid; place-items:center; width:55px; height:55px; border-radius:18px; color:#6b9973; background:#ecf4ea; }
    .empty-illustration svg { width:27px; height:27px; }
    .empty-small h3 { margin:0; font-size:17px; color:#3f5f46; }
    .empty-small p { margin:0; font-size:16px; color:#94a599; }
    .day-empty { display:flex; align-items:center; justify-content:space-between; gap:15px; border-radius:13px; padding:18px 20px; background:#f7faf6; border:1px dashed #d9e6d8; }
    .day-empty p { color:#88998d; margin:0; font-size:16px; }
    .soft-hr { height:1px; background:var(--line); }
    .ideas-toolbar { display:flex; gap:15px; align-items:center; justify-content:space-between; padding:22px 24px; }
    .ideas-toolbar h2 { margin:0; font-size:20px; font-weight:760; color:var(--ink); }
    .ideas-toolbar p { margin:5px 0 0; font-size:16px; color:#90a094; }
    .idea-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); padding:0 24px 24px; gap:13px; }
    .idea-grid .idea-card { min-height:188px; display:flex; flex-direction:column; }
    .idea-grid .idea-card h3 { font-size:18px; }
    .idea-grid .idea-card p { font-size:16px; line-height:1.5; }
    .idea-grid .idea-card-bottom { margin-top:auto; }
    .blank-state { display:grid; justify-items:center; text-align:center; padding:64px 20px 70px; }
    .blank-state .empty-illustration { width:66px; height:66px; margin-bottom:18px; }
    .blank-state h3 { margin:0 0 9px; font-size:22px; color:#355540; }
    .blank-state p { max-width:385px; margin:0 0 22px; color:#84978a; font-size:16px; }
    .progress-layout { display:grid; grid-template-columns:1.2fr .8fr; gap:20px; }
    .progress-panel { padding:27px; }
    .progress-panel h2 { margin:0 0 7px; font-size:22px; color:#233b2b; letter-spacing:-.5px; }
    .progress-panel .panel-desc { color:#8a9b8e; font-size:16px; margin:0 0 29px; }
    .progress-number { display:flex; gap:12px; align-items:end; margin-bottom:23px; }
    .progress-number strong { font-size:54px; font-weight:790; line-height:1; letter-spacing:-2px; color:#426e4a; }
    .progress-number span { padding-bottom:7px; color:#879c8a; font-size:16px; }
    .progress-bar { height:16px; overflow:hidden; border-radius:50px; background:#edf1eb; display:flex; }
    .progress-bar span { min-width:0; height:100%; }
    .progress-bar .part-published { background:#628c69; }

    const POSTS_FORMAT='planifica-tus-redes-publicaciones';

      if(parsed.version!==POSTS_VERSION)return fail(`"version" debe ser el número ${POSTS_VERSION}.`);

        if(!isRecord(row)){result.errors.push(`${label}: debe ser un objeto.`);return;}

        else if(/[\r\n\t]/.test(title))problems.push('"title" debe ocupar una sola línea, sin saltos de línea ni tabulaciones');
        if(row.caption!==undefined&&typeof row.caption!=='string')problems.push('"caption" debe ser texto');
        else if(typeof row.caption==='string'&&row.caption.length>20000)problems.push(`"caption" tiene ${row.caption.length} caracteres; el máximo es 20000`);
        if(row.type!==undefined&&!Object.hasOwn(TYPES,row.type))problems.push(`"type" no válido; valores permitidos: ${Object.keys(TYPES).join(', ')}`);
        if(row.status!==undefined&&!Object.hasOwn(STATUS,row.status))problems.push(`"status" no válido; valores permitidos: ${Object.keys(STATUS).join(', ')}`);
        if(row.date!==undefined&&row.date!==null&&!validDate(row.date))problems.push('"date" debe ser null o una fecha real con formato AAAA-MM-DD');
        const networks=[];
        if(!Array.isArray(row.networks)||!row.networks.length)problems.push('"networks" debe ser una lista con al menos una red');
        else if(row.networks.length>MAX_NETWORKS)problems.push(`"networks" admite hasta ${MAX_NETWORKS} redes`);

          if(!Object.hasOwn(PLATFORM,platform)){problems.push(`red no reconocida: ${JSON.stringify(platform??entry)}; valores permitidos: ${Object.keys(PLATFORM).join(', ')}`);return;}

            if(!found.length){problems.push(`el cliente «${client.name}» no tiene una cuenta de ${PLATFORM[platform]} con el usuario ${entry.username}`);return;}
            if(found.length>1){problems.push(`el cliente «${client.name}» tiene ${found.length} cuentas de ${PLATFORM[platform]} con el usuario ${entry.username}; dejá sólo una en Clientes y cuentas`);return;}
          }
          if(!found.length){problems.push(`el cliente «${client.name}» no tiene configurada la red ${PLATFORM[platform]} (${platform})`);return;}
          if(found.length>1){problems.push(`el cliente «${client.name}» tiene ${found.length} cuentas de ${PLATFORM[platform]}: indicá cuál con {"platform": "${platform}", "username": "…"}`);return;}

        });
        if(problems.length){result.errors.push(`${label}: ${problems.join('; ')}.`);return;}
        const item=cleanItem(withNetworks({id:uid(),title,caption:row.caption??'',type:row.type??'post',status:row.status??'idea',date:row.date??null,clientId,importId:row.importId,createdAt:now,updatedAt:now},networks));

    }

    function openImportDialog(){
      let parsed=null,fileError='',result=null;
      const preferred=state.clientFilter!=='all'&&state.clients.some(c=>c.id===state.clientFilter)?state.clientFilter:(state.clients.find(c=>c.id!==PERSONAL)?.id||PERSONAL);
      manager('Importar datos',`<fieldset class="import-modes"><legend>¿Qué querés importar?</legend><label class="import-mode"><input type="radio" name="mode" value="full" checked><span><strong>Restauración completa</strong><small>Reemplaza todos tus contenidos, clientes y cuentas por los de un respaldo exportado desde esta aplicación.</small></span></label><label class="import-mode"><input type="radio" name="mode" value="posts"><span><strong>Importar únicamente publicaciones</strong><small>Agrega publicaciones a un cliente existente. No modifica ni borra nada de lo que ya tenés.</small></span></label></fieldset><p class="import-warning" id="import-full-warning"><strong>Atención:</strong> la restauración completa reemplaza todos los datos guardados en este navegador. Si querés conservarlos, exportá un respaldo antes de continuar.</p><div id="import-posts-fields" hidden><div class="field"><label for="import-client">Cliente de destino</label><select id="import-client" name="client">${clientOptions(preferred)}</select><p class="field-help" id="import-client-hint"></p></div><div class="field"><label for="import-posts-file">Archivo JSON de publicaciones</label><input id="import-posts-file" type="file" accept="application/json,.json"></div><div id="import-preview" aria-live="polite"></div></div>`,data=>{
        if(data.get('mode')!=='posts'){$('import-file').click();return true;}
        refresh(); // Validate again against the current data right before writing.
        if(!importReady(result)){notify(fileError||result?.fatal||(result?.errors.length?'El archivo tiene errores. No se importó ninguna publicación.':result?'No hay publicaciones nuevas para importar.':'Seleccioná un archivo JSON de publicaciones.'),true);return false;}
        const {items:added,duplicates,client}=result;
        if(!commit(()=>{state.items=[...state.items,...added];}))return false;
        const hidden=added.some(x=>!matches(x));
        notify(`Se importaron ${added.length} ${added.length===1?'publicación':'publicaciones'} en «${client.name}».${duplicates.length?` ${duplicates.length} ya existían y se omitieron.`:''}${hidden?' Limpiá los filtros para verlas todas.':''}`);
        return true;
      },'Elegir archivo');
      const form=$('manager-form'),submit=form.querySelector('[type=submit]');
      function refresh(){
        const posts=form.querySelector('input[name=mode]:checked').value==='posts',clientId=$('import-client').value;
        const accounts=state.accounts.filter(a=>a.clientId===clientId);
        $('import-posts-fields').hidden=!posts;$('import-full-warning').hidden=posts;
        $('import-client-hint').textContent=accounts.length?`Redes configuradas: ${accounts.map(a=>`${PLATFORM[a.platform]} (${a.username})`).join(', ')}.`:'Este cliente no tiene cuentas configuradas. Agregalas en Clientes y cuentas antes de importar.';
        result=parsed?validatePostsImport(parsed,clientId):null;
        $('import-preview').innerHTML=fileError?`<p class="import-status is-error" role="alert">${escapeHTML(fileError)} Tus datos no se modificaron.</p>`:result?importPreviewHTML(result):'';
        submit.textContent=!posts?'Elegir archivo de respaldo':importReady(result)?`Importar ${result.items.length} ${result.items.length===1?'publicación':'publicaciones'}`:'Importar publicaciones';
        submit.disabled=posts&&!importReady(result);
      }
      async function loadFile(file){
        parsed=null;fileError='';
        if(file){
          if(!/\.json$/i.test(file.name))fileError='Seleccioná un archivo JSON (.json).';
          else if(file.size>20*1024*1024)fileError='El archivo es demasiado grande para importar.';
          else try{parsed=parseBackupJSON(await file.text());}catch(error){fileError=`El archivo no es un JSON válido (${error.message||'error de lectura'}).`;}
        }
        refresh();
      }
      form.addEventListener('change',e=>{if(e.target.id==='import-posts-file')loadFile(e.target.files?.[0]);else if(e.target.name==='mode'||e.target.id==='import-client')refresh();});
      refresh();
    }
    function handleAction(event) {
      if(event.target.closest('.drag-handle') && drag?.started)return;
      const btn=event.target.closest('[data-action]'); if(!btn)return;
      const a=btn.dataset.action;
      if(btn.tagName==='A')event.preventDefault();
      if(a==='mobile-work-tab'){changeMobileWorkTab(btn.dataset.mobileTab);return;}
      if(a==='help'){navigate('help');return;}
      if(a==='license'){event.preventDefault();navigate('help');$('page-content').querySelector('[data-commercial-doc=licencia]').click();return;}
      if(a==='mobile-pick-date'){togglePlanningPicker();return;}
      if(a==='mobile-plan'){planMobileIdea(btn.dataset.id);return;}
      if(a==='mobile-move'){openMobileMove(btn.dataset.id);return;}
      if(a==='back-calendar'){const controls=$('calendar-controls');controls?.querySelector('button')?.focus({preventScroll:true});controls?.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});return;}
      if(a.startsWith('client-')||a.startsWith('account-')){manageAction(a,btn.dataset.id);return;}
      if(a==='clear-filters'){if(state.page==='progress')progressStatusFilter='all';commit(()=>{state.clientFilter='all';state.platformFilter='all';});return;}
      if(a==='nav')navigate(btn.dataset.page);
      else if(a==='toggle-sidebar'){sidebarCollapsed=!sidebarCollapsed;try{localStorage.setItem(SIDEBAR_KEY,sidebarCollapsed?'collapsed':'expanded');}catch{} render();}
      else if(a==='toggle-sidebar-backups'){const pop=$('sidebar-backup-pop');const open=pop.classList.toggle('open');btn.setAttribute('aria-expanded',String(open));}
      else if(a==='work-tab'){workTab=btn.dataset.tab;render();}
      else if(a==='new-post')openModal({date:state.page==='calendar'?state.selectedDate:today()});
      else if(a==='new-idea')openModal({idea:true});
      else if(a==='add-date')openModal({date:btn.dataset.date});
      else if(a==='edit')openModal({id:btn.dataset.id});
      else if(a==='plan'){ const item=state.items.find(x=>x.id===btn.dataset.id); if(item){navigate('calendar');openModal({id:item.id,date:state.selectedDate});} }
      else if(a==='close-modal')closeModal();
      else if(a==='toggle-text-editor')setTextExpanded(!textExpanded());
      else if(a==='clear-date'){$('item-date').value='';updateDateState();}
      else if(a==='delete-item')deleteItem();
      else if(a==='prev')changePeriod(-1);
      else if(a==='next')changePeriod(1);
      else if(a==='today'){state.focusDate=today();state.selectedDate=today();render();}
      else if(a==='mode')changeMode(btn.dataset.mode);
      else if(a==='select-date'){const date=btn.dataset.date; if(!validDate(date))return;state.selectedDate=date;workTab='day';if(state.mode==='month'&&monthTitle(date)!==monthTitle(state.focusDate))state.focusDate=date;render();if(window.innerWidth<=790)requestAnimationFrame(()=>$('mobile-calendar-panel')?.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}));}
      else if(a==='export'){closeBackupMenu();exportBackup();}
      else if(a==='import'){closeBackupMenu();openImportDialog();}
      else if(a==='backups')toggleBackupMenu();
    }
    function closeBackupMenu(){ $('mobile-backup-menu').classList.remove('open'); $('mobile-backup-icon').setAttribute('aria-expanded','false'); }
    function toggleBackupMenu(){ const open=$('mobile-backup-menu').classList.toggle('open'); $('mobile-backup-icon').setAttribute('aria-expanded',String(open)); }
    function clearDrag() {
      if(!drag)return;
      if(drag.ghost)drag.ghost.remove();document.querySelectorAll('.drop-active').forEach(el=>el.classList.remove('drop-active'));
      document.body.classList.remove('dragging'); drag=null;
      if(scrollLoop){cancelAnimationFrame(scrollLoop);scrollLoop=null;}
    }
    function positionGhost(x,y){if(!drag?.ghost)return;drag.ghost.style.left=`${Math.min(x+12,window.innerWidth-236)}px`;drag.ghost.style.top=`${Math.min(y+14,window.innerHeight-60)}px`;}
    function markTarget(x,y){if(!drag?.started)return;const candidate=document.elementFromPoint(x,y)?.closest('[data-drop-date],[data-drop-bank]');const item=state.items.find(x=>x.id===drag.id);const el=candidate?.hasAttribute('data-drop-bank')&&!item?.date?null:candidate;const prev=drag.target;if(prev!==el){prev?.classList.remove('drop-active');drag.target=el||null;drag.target?.classList.add('drop-active');}}
    function autoscroll(){if(!drag?.started){scrollLoop=null;return;}let v=0;if(drag.y>window.innerHeight-105)v=15;else if(drag.y<75)v=-15;if(v)window.scrollBy(0,v);markTarget(drag.x,drag.y);scrollLoop=requestAnimationFrame(autoscroll);}
    function onPointerDown(e){
      const handle=e.target.closest('.drag-handle');if(!handle||e.button!==0||drag)return;
      const item=state.items.find(x=>x.id===handle.dataset.dragId);if(!item)return;
      drag={id:item.id,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,started:false,ghost:null,target:null,handle};
      try {handle.setPointerCapture(e.pointerId);}catch{}
    }
    function onPointerMove(e){
      if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;
      if(!drag.started){if(Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)<8)return;drag.started=true;document.body.classList.add('dragging');const item=state.items.find(x=>x.id===drag.id);const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=item?.title||'Publicación';document.body.append(ghost);drag.ghost=ghost;scrollLoop=requestAnimationFrame(autoscroll);}
      e.preventDefault();positionGhost(e.clientX,e.clientY);markTarget(e.clientX,e.clientY);
    }
    function onPointerUp(){
      if(!drag)return;const {id,target,started}=drag;const item=state.items.find(x=>x.id===id);const date=target?.dataset.dropDate;const toBank=target?.hasAttribute('data-drop-bank');
      clearDrag();
      if(started&&item?.date&&toBank){
        const before=state.items;
        state.items=state.items.map(x=>x.id===id?{...x,date:null}:x);
        if(!save()){state.items=before;return;}
        workTab='ideas';render();notify('Publicación movida al banco de ideas.');return;
      }
      if(!started||!item||!validDate(date)||item.date===date)return;
      const before=state.items;const updated={...item,date};
      state.items=state.items.map(x=>x.id===id?updated:x);
      if(!save()){state.items=before;return;}
      state.focusDate=date;state.selectedDate=date;state.page='calendar';render();notify(item.date?'Publicación movida a otra fecha.':'Idea añadida al calendario.');
    }
    let tooltipTarget=null;
    function hideCalendarTooltip(){
      if(tooltipTarget)tooltipTarget.removeAttribute('aria-describedby');
      tooltipTarget=null;$('calendar-tooltip').hidden=true;
    }
    function showCalendarTooltip(target){
      if(!target||window.innerWidth<=790||drag||$('modal-overlay').classList.contains('open'))return;
      const item=state.items.find(x=>x.id===target.dataset.tooltipId);if(!item)return;
      hideCalendarTooltip();tooltipTarget=target;
      const networks=networksOf(item),tip=$('calendar-tooltip');
      const networkLabel=networks.length>1?'Redes sociales':networkAccount(networks[0])?'Cuenta':'Red social';
      tip.innerHTML=`<strong>${escapeHTML(item.title)}</strong><p><span class="tooltip-label">Cliente:</span> ${escapeHTML(clientOf(item).name)}</p><p><span class="tooltip-label">${networkLabel}:</span> ${escapeHTML(networkLabels(item,compactAccountLabel).join(', '))}</p><p><span class="tooltip-label">Tipo:</span> ${escapeHTML(TYPES[item.type])}</p><p><span class="tooltip-label">Estado:</span> ${escapeHTML(STATUS[item.status])}</p>`;
      tip.hidden=false;target.setAttribute('aria-describedby','calendar-tooltip');
      const rect=target.getBoundingClientRect(),box=tip.getBoundingClientRect();
      tip.style.left=`${Math.max(12,Math.min(rect.left,window.innerWidth-box.width-12))}px`;
      const below=rect.bottom+8;
      tip.style.top=`${Math.max(12,Math.min(below+box.height<=window.innerHeight-12?below:rect.top-box.height-8,window.innerHeight-box.height-12))}px`;
    }
    document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const target=e.target.closest('[data-tooltip-id]');if(target&&target!==tooltipTarget)showCalendarTooltip(target);});
    document.addEventListener('pointerout',e=>{if(tooltipTarget?.contains(e.target)&&!tooltipTarget.contains(e.relatedTarget))hideCalendarTooltip();});
    document.addEventListener('focusin',e=>{const target=e.target.closest('[data-tooltip-id]');if(target)showCalendarTooltip(target);else hideCalendarTooltip();});
    document.addEventListener('focusout',e=>{if(tooltipTarget===e.target)hideCalendarTooltip();});
    document.addEventListener('pointerdown',hideCalendarTooltip);
    document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCalendarTooltip();});
    document.addEventListener('scroll',hideCalendarTooltip,true);
    window.addEventListener('resize',hideCalendarTooltip);
    document.addEventListener('click',e=>{if(!e.target.closest('.mobile-brand'))closeBackupMenu();});
    document.addEventListener('click',handleAction);
    document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.week-day[data-action=select-date]')){e.preventDefault();e.target.click();}});
    document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-drag-id]')){e.preventDefault();openModal({id:e.target.dataset.dragId});$('item-date').focus();}});
    document.addEventListener('pointerdown',onPointerDown);
    document.addEventListener('pointermove',onPointerMove,{passive:false});
    document.addEventListener('pointerup',onPointerUp);
    document.addEventListener('pointercancel',clearDrag);
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeBackupMenu();if(drag)clearDrag();if($('modal-overlay').classList.contains('open')){if(textExpanded())setTextExpanded(false);else closeModal();}} });
    $('modal-overlay').addEventListener('click',e=>{if(e.target!==$('modal-overlay'))return;if(textExpanded())setTextExpanded(false);else closeModal();});
    $('item-form').addEventListener('submit',submitForm);
    $('item-date').addEventListener('change',updateDateState);
    $('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';await importBackup(file);});
    $('desktop-brand-icon').innerHTML=icon('logo');$('mobile-brand-icon').innerHTML=icon('logo');document.querySelectorAll('.commercial-help-icon,.mobile-help-icon').forEach(el=>el.innerHTML=icon('info'));$('download-icon').innerHTML=icon('download');$('upload-icon').innerHTML=icon('upload');$('modal-close-icon').innerHTML=icon('close');$('item-text-expand').innerHTML=icon('expand');$('mobile-backup-icon').innerHTML=icon('download')+'<span>Exportar</span>';$('mobile-download').innerHTML=icon('download');$('mobile-upload').innerHTML=icon('upload');
    // UI accessibility only: focus stays in the modal, including when keyboard navigation wraps.
    document.addEventListener('keydown',e=>{
      if(e.key!=='Tab'||!$('modal-overlay').classList.contains('open'))return;
      const dialog=$('modal-overlay').querySelector('.modal');
      const focusables=[...dialog.querySelectorAll('button:not([disabled]):not([hidden]),input:not([disabled]):not([hidden]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(el=>el.getClientRects().length);
      if(!focusables.length)return;
      const first=focusables[0],last=focusables[focusables.length-1];
      if(e.shiftKey && (document.activeElement===first || !dialog.contains(document.activeElement))){e.preventDefault();last.focus();}
      else if(!e.shiftKey && (document.activeElement===last || !dialog.contains(document.activeElement))){e.preventDefault();first.focus();}
    });
    $('item-title').addEventListener('input',()=>{if($('item-title').value.trim())$('item-title').removeAttribute('aria-invalid');});
    $('item-date').addEventListener('input',()=>$('item-date').removeAttribute('aria-invalid'));
    if(window.visualViewport){
      const fitModal=()=>{document.documentElement.style.setProperty('--visual-viewport-height',`${Math.round(window.visualViewport.height)}px`);document.documentElement.style.setProperty('--visual-viewport-offset-top',`${Math.round(window.visualViewport.offsetTop)}px`);if(!entry.hidden&&entry.contains(document.activeElement)&&document.activeElement.matches('input,textarea,select'))requestAnimationFrame(()=>document.activeElement.scrollIntoView({block:'nearest'}));};
      window.visualViewport.addEventListener('resize',fitModal);
      window.visualViewport.addEventListener('scroll',fitModal);
      fitModal();
    }
    $('item-client').addEventListener('change',changeItemClient);
    document.addEventListener('change',e=>{if(e.target.id==='filter-status'){progressStatusFilter=e.target.value;render();return;}if(e.target.id==='filter-client'||e.target.id==='filter-platform'){const field=e.target.id==='filter-client'?'clientFilter':'platformFilter';commit(()=>{state[field]=e.target.value;});}});
    // Mis bonos reuses the existing data model, commit/save, dialogs and notifications.
    window.PlanificaBonos?.init({state,commit,manager,notify,render,navigate,icon,platformIcon,PLATFORM,TYPES,STATUS,PERSONAL,uid,cleanItem,validDate,dateKey,parseDate,today,startWeek,accountLabel:compactAccountLabel,focusTarget,restoreFocus});
    formSelectValues();render();startEntry();
    if(storageError)notify('No se pudieron leer los datos guardados. Se conservaron intactos; no se sobrescribirán.',true);else save();
  })();
  </script>
